# Example machine inventory. data/machines.yaml is PER-MACHINE state and is
# git-ignored: each host keeps its own view, including an entry for itself.
#
#   ./machine_mgr self --register     # add/refresh this host (backend: local)
#   ./machine_mgr scan --register     # add other hosts found on the LAN
#
# backend: local  -> commands run on this host directly (no ssh)
# backend: ssh    -> commands run over ssh using ssh_user/ssh_port
# No IP is stored: addresses are resolved from the MAC at call time.

version: 1
machines:
- mac: 02:00:aa:bb:cc:01
  name: this-host
  hostname: workstation
  ssh_user: ''
  ssh_port: 22
  project_root: /home/<user>/project
  backend: local
  os: ubuntu
  os_version: Ubuntu 24.04.5 LTS
  notes: this host; created by `machine_mgr self --register`
- mac: cc:5e:f8:00:11:22
  name: training-box
  hostname: gpu-box
  ssh_user: trainer
  ssh_port: 22
  project_root: /home/trainer/project
  backend: ssh
  os: ubuntu
  os_version: Ubuntu 24.04.5 LTS
  notes: ''
